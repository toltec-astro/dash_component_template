[project]
name = "dash_component_template"
dynamic = ["version"]
description = "A framework to create reusable Dash layout."
readme = "README.md"
authors = [{ name = "Zhiyuan Ma", email = "zhiyuanma@umass.edu" }]
maintainers = [{ name = "Zhiyuan Ma", email = "zhiyuanma@umass.edu" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">= 3.13"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "dash",
  "treelib",
  "anytree",
  "dash-mantine-components",
  "typer",
]

[dependency-groups]
test = [
  "pytest",
  "pytest-doctestplus",
  "pytest-remotedata",
  "pytest-benchmark",
  "coverage",
  "ruff",
  "pre-commit",
  "ty",
  "dash-bootstrap-components",  # used by tests + stub generator
]

dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "pandas-stubs",
  "narwhals",
  "ipdb",
]

docs = [
  "myst-parser",
  "sphinx",
  "sphinx-astropy[confv2]",
  "sphinx-copybutton",
  "sphinx_book_theme",
  "autodoc_pydantic[erdantic]",
  "sphinxcontrib-typer",
  "sphinx-autobuild",
  "ghp-import",
]

[project.urls]
bugs = "https://github.com/toltec-astro/dash_component_template/issues"
changelog = "https://github.com/toltec-astro/dash_component_template/releases"
documentation = "https://toltec-astro.github.io/dash_component_template/"
homepage = "https://github.com/toltec-astro/dash_component_template"

[project.scripts]
dash_component_template = "dash_component_template.cli:app"

[build-system]
requires = ["setuptools>=80", "setuptools_scm>=8"]
build-backend = 'setuptools.build_meta'

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
  "data/*",
  "data/*/*",
  "data/*/*/*",
  "data/*/*/*/*",
  "data/*/*/*/*/*",
  "data/*/*/*/*/*/*",
]

[tool.setuptools_scm]
version_file = "src/dash_component_template/_version.py"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests", "docs"]
norecursedirs = [".*", "docs[\\/]_build", "docs[\\/]generated", "examples"]
doctest_plus = "enabled"
text_file_format = "rst"
remote_data_strict = true
addopts = [
  "-ra",
  "--color=yes",
  "--doctest-rst",
  "--strict-config",
  "--strict-markers",
  "-p no:legacypath",
  "-p no:cacheprovider",
]
log_cli_level = "INFO"
xfail_strict = "true"
filterwarnings = ["error"]

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ty.src]
include = ["src", "tests"]
exclude = [
  "docs/conf.py",
  # TODO: pre-existing type errors; fix separately
  "src/dash_component_template/lazy_component.py",
  "src/dash_component_template/naming.py",
  "src/dash_component_template/stubs",
  "src/dash_component_template/template.py",
  "tests",
]

[tool.ruff]
line-length = 88
exclude = [
  "src/dash_component_template/_version.py",
  "src/dash_component_template/stubs",
]
lint.future-annotations = true
lint.select = ["ALL"]
lint.ignore = [
  # flake8-builtins (A) : shadowing a Python built-in.
  # New ones should be avoided and is up to maintainers to enforce.
  "A00",
  "ARG001",  # unused-function-argument
  "ARG002",  # unused-method-argument
  "ARG003",  # unused-class-method-argument
  "ARG004",  # unused-static-method-argument
  "ARG005",  # unused-lambda-argument
  "SLF001",  # private member access
  "TID252",  # relative imports
  "ANN401",  # using Any type annotation
  "ANN002",  # missing type args
  "ANN003",  # missing type kwargs
  "D102",    # missing docs in public method
  "D105",    # missing docs in magic method
  "TRY003",  # f-string in exception
  "ERA001",  # commented out code
  "FIX002",  # todo comments
  "FIX004",  # hack comments
  "TD002",   # todo missing author
  "TD003",   # todo missing issue
  "G004",    # f-string in logging
  "N806",    # non-lowercase variable name
  "S101",    # use of assert; needed for narrowing types
  "COM812",  # trailing comma (conflicts with ruff formatter)
  "ISC001",  # implicit string concatenation (conflicts with ruff formatter)
  "PLC0415", # import not at top of file (deferred imports for circular-import avoidance)
  "D401",    # docstring first line imperative mood (style preference)
  "EM101",   # exception must not use string literal (consistent with TRY003)
  "EM102",   # exception must not use f-string literal (consistent with TRY003)
  "N801",    # class name should use CapWords (callback_scope is intentionally snake_case)
  "FBT001",  # boolean positional argument type (API design choice)
  "FBT002",  # boolean default positional argument (API design choice)
  "TC003",   # move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = [
  "INP001", # implicit namespace package (examples/ has no __init__.py)
  "ANN",    # missing type annotations (examples are demonstration scripts)
  "D",      # pydocstyle (examples use informal docstrings)
  "S104",   # binding to all interfaces (0.0.0.0 intentional for WSL2)
  "T20",    # print statements (examples use print for instructions)
  "RUF001", # ambiguous unicode chars (× used intentionally)
  "EM",     # exception message style
  "TRY",    # exception handling style
  "E501",   # long strings acceptable in HTML layout code
]

"test_*.py" = [
  "D",       # pydocstyle
  "ERA001",  # commented out code
  "PLR2004", # magic value comparison
  "E721",    # type comparison using type()
  "PT011",   # pytest-raises-too-broad
  "PT018",   # pytest-composite-assertion
  "RUF043",  # pytest regex
  "PLC0415", # not top level imports
  "ANN202",  # missing return type annotation
  "F841",    # local variable assigned but never used
  "T201",    # print statements (benchmark tests use print)
]

"docs/conf.py" = [
  "D",      # pydocstyle
  "ERA001", # commented out code
  "INP001", # implicit namespace package (docs/ has no __init__.py)
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
branch = true
parallel = true
source = ["src/dash_component_template"]
omit = ["*/tests/*", "*/test_*", "*/_version.py", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
  "@overload",
  "except.*Error.*:",
  "except.*Exception.*:",
]

[tool.repo-review]
ignore = [
  "PY007", # ignore task runner
  "PC111", # ignore blacken-docs
  "PC140", # ignore type checker
  "PC180", # ignore markdown formatter
  "PC901", # ignore custom update message
  "MY",    # ignore mypy
  "RTD",   # ignore RTD
  "SCFG",  # ignore setup.cfg
  "GH",    # ignore GitHub Actions (no workflows by default)
]

[tool.codespell]
ignore-words-list = """
fo
"""

[tool.uv]
package = true
default-groups = ['dev']
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.cruft]
skip = [".git"]
